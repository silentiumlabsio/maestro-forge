name: Bug report
description: Report a reproducible problem in merged repository content.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: markdown
    attributes:
      value: "If this bug is a security vulnerability, stop and use the private security reporting process in SECURITY.md instead of posting exploit details here."
