name: Propose a community project
description: Start an incubator project and recruit contributors.
title: "[Project] "
labels: ["incubator"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
    validations:
      required: true
  - type: textarea
    id: roles
    attributes:
      label: Roles needed
  - type: input
    id: repo
    attributes:
      label: Contributor-owned repository URL (optional)
  - type: textarea
    id: safety
    attributes:
      label: Security and privacy considerations
